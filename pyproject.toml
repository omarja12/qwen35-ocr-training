[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-eval"
version = "0.2.0"
description = "Evaluation harness for the Arabic document OCR fine-tune: scores predictions against a reference corpus, compares checkpoints, and measures hallucination on unreadable input."
requires-python = ">=3.10"

# Deliberately empty, and this is a design decision rather than an oversight.
# Every added wheel is a build risk for the air-gapped image (constitution III),
# so the harness runs on the standard library alone. rapidfuzz below is a speed
# option that cannot change a number: metrics/distance.py ships a pure-Python
# Myers bit-parallel fallback that returns identical integers (research R-001).
dependencies = []

[project.optional-dependencies]
fast = ["rapidfuzz"]
test = ["pytest"]

[project.scripts]
ocr-eval = "ocr_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works from a bare checkout with nothing installed and no
# PYTHONPATH set. "src" puts the package on the path; "." lets tests import
# tests.conftest helpers. The suite must run offline against committed fixtures
# with no setup step, or it will not be run.
pythonpath = ["src", "."]
